name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Format check (ruff)
        run: uv run ruff format --check
      - name: Type check (ty)
        run: uv run ty check
      - name: Tests (pytest)
        run: uv run pytest
